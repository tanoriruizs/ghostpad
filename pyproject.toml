[project]
name = "ghostpad"
version = "1.1.0"
description = "Tu teléfono como mando de Xbox real para Windows, desde el navegador y sin instalar nada."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Sebastian Tanori" }]
dependencies = ["aiohttp>=3.9", "vgamepad>=0.1.0", "qrcode>=7.4", "colorama>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:aiohttp.*"]
