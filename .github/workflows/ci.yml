name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # vgamepad necesita el driver ViGEmBus (solo Windows); los tests usan un
      # doble del módulo, así que aquí basta con aiohttp y pytest.
      - run: pip install aiohttp pytest
      - run: pytest -q
      - name: Comprueba que el JS del cliente parsea
        run: node --check web/app.js
